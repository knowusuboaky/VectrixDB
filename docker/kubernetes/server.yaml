# The server: the REST API and the dashboard, with its collections on a
# volume. See kustomization.yaml for how to apply it.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vectrixdb-data
  labels:
    app.kubernetes.io/name: vectrixdb
    app.kubernetes.io/component: server
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vectrixdb
  labels:
    app.kubernetes.io/name: vectrixdb
    app.kubernetes.io/component: server
spec:
  # One replica on a ReadWriteOnce volume, stopped before the next starts, so
  # two processes never write the same files.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vectrixdb
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vectrixdb
        app.kubernetes.io/component: server
    spec:
      # It never talks to the Kubernetes API, so it holds no token for it, and
      # it takes no VECTRIXDB_* variables from the namespace's Services.
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      # OpenShift picks the user itself: remove runAsUser, runAsGroup and
      # fsGroup there, and the image's group 0 lets that user write /data.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/knowusuboaky/vectrixdb
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7337
          env:
            - name: VECTRIXDB_API_KEY_FILE
              value: /var/run/secrets/vectrixdb/api-key
            # Scans, recordings and videos go to the extraction service.
            - name: VECTRIXDB_EXTRACTOR_URL
              value: http://vectrixdb-extract:7338
            - name: VECTRIXDB_EXTRACTOR_KEY_FILE
              value: /var/run/secrets/vectrixdb/api-key
            - name: VECTRIXDB_EXTRACTOR_KEY_HEADER
              value: api-key
            # Tracing: name the collector, and every search, ingest and
            # evaluation run becomes a trace there. Never the query text.
            # - name: OTEL_EXPORTER_OTLP_ENDPOINT
            #   value: http://otel-collector.observability:4318
            # Sources: the feeds and pages a collection keeps up with may be
            # on these hosts and no others. Left out, any public host; a
            # CronJob refreshes them, as docs/how-to/sources.md shows.
            # - name: VECTRIXDB_SOURCES_HOSTS
            #   value: "news.example.com,*.example.org"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: key
              mountPath: /var/run/secrets/vectrixdb
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vectrixdb-data
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: key
          secret:
            secretName: vectrixdb-key
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: vectrixdb
  labels:
    app.kubernetes.io/name: vectrixdb
    app.kubernetes.io/component: server
spec:
  selector:
    app.kubernetes.io/name: vectrixdb
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 7337
      targetPort: http

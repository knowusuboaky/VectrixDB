# The extraction service: files, addresses and videos in, text out, for the
# server alone. It keeps nothing that must outlive the pod: a long job's output
# is kept under /data for as long as the pod runs.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vectrixdb-extract
  labels:
    app.kubernetes.io/name: vectrixdb-extract
    app.kubernetes.io/component: extraction
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vectrixdb-extract
      app.kubernetes.io/component: extraction
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vectrixdb-extract
        app.kubernetes.io/component: extraction
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: extract
          image: ghcr.io/knowusuboaky/vectrixdb-extract
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7338
          env:
            - name: VECTRIXDB_API_KEY_FILE
              value: /var/run/secrets/vectrixdb/api-key
            # Tracing: the server's collector, and each file read becomes a
            # span in the trace of the upload that sent it. Never its name.
            # - name: OTEL_EXPORTER_OTLP_ENDPOINT
            #   value: http://otel-collector.observability:4318
            # - name: OTEL_SERVICE_NAME
            #   value: vectrixdb-extract
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          # Speech and OCR on the machine are the heavy part: give it room.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: key
              mountPath: /var/run/secrets/vectrixdb
              readOnly: true
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 4Gi
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
        - name: key
          secret:
            secretName: vectrixdb-key
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: vectrixdb-extract
  labels:
    app.kubernetes.io/name: vectrixdb-extract
    app.kubernetes.io/component: extraction
spec:
  selector:
    app.kubernetes.io/name: vectrixdb-extract
    app.kubernetes.io/component: extraction
  ports:
    - name: http
      port: 7338
      targetPort: http

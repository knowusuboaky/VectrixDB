# Release VectrixDB: one button, one approval.
#
# Two ways in, one path out:
#   * Actions > "Release" > Run workflow. It reads the version from
#     pyproject.toml (or the one you type), and makes the tag and the GitHub
#     release itself, with the changelog's section as its notes.
#   * Publishing a release by hand on GitHub, as before. The tag must match
#     the packaged version.
#
# Either way, nothing reaches PyPI unless:
#   1. CHANGELOG.md has a dated section for the version, not "Unreleased";
#   2. no tag for it exists yet (when the workflow makes the tag);
#   3. the full CI suite passes;
#   4. the built version matches, the metadata is valid for PyPI and the
#      wheel is under PyPI's 100 MB limit;
# and then the "pypi" environment waits for one approval from the maintainer.
# Once PyPI has it, containers.yml builds the container images from the same
# wheel, checks them, and pushes them to ghcr.io signed, and the clients go
# out at the same version: npm `vectrixdb` from sdk/typescript, crates.io
# `vectrixdb` from sdk/rust, and the tag sdk/go/v<version> that Go reads for
# github.com/knowusuboaky/VectrixDB/sdk/go/v2. A version a registry already
# has is skipped, so a release can be run again after a failure.
#
# Publishing uses PyPI Trusted Publishing (OIDC), configured at
# https://pypi.org/manage/project/vectrixdb/settings/publishing/ with owner
# `knowusuboaky`, repo `VectrixDB`, workflow `python-publish.yml` and
# environment `pypi`. That names this file, so it keeps its name. npm and
# crates.io take the same kind of trusted publisher (repo `VectrixDB`, workflow
# `python-publish.yml`, no environment), set up in each package's settings;
# until it is, the secrets NPM_TOKEN and CARGO_REGISTRY_TOKEN stand in.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, such as 2.2.0. Empty: the version in pyproject.toml."
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Version, changelog and tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      client_version: ${{ steps.clients.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Work out the version
        id: version
        env:
          ASKED: ${{ github.event.inputs.version }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          declared="$(python scripts/release_notes.py --version)"
          if [ "${{ github.event_name }}" = "release" ]; then
            wanted="${TAG#v}"
          else
            wanted="${ASKED#v}"
            wanted="${wanted:-$declared}"
          fi
          if [ "$wanted" != "$declared" ]; then
            echo "::error::pyproject.toml declares $declared, not $wanted. Bump the version first."
            exit 1
          fi
          echo "version=$wanted" >> "$GITHUB_OUTPUT"
          echo "Releasing $wanted"

      - name: The changelog has a dated section for it
        run: python scripts/release_notes.py "${{ steps.version.outputs.version }}" --check > /dev/null

      # The four clients ship at one version, so a release cannot carry a
      # client that still says the last one. npm, crates.io and Go write a
      # pre-release as 2.3.0-rc.1 where PyPI has 2.3.0rc1.
      - name: The clients declare the same version
        id: clients
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python scripts/release.py --clients "$VERSION"
          module="$(sed -n 's/^module //p' sdk/go/go.mod)"
          major="${VERSION%%.*}"
          if [ "$major" -ge 2 ] && [ "${module##*/}" != "v$major" ]; then
            echo "::error::sdk/go/go.mod is $module; a $major.x release needs /v$major at its end"
            exit 1
          fi
          echo "version=$(python scripts/release.py --client-version "$VERSION")" >> "$GITHUB_OUTPUT"

      - name: No tag for it exists yet
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.version.outputs.version }}" > /dev/null; then
            echo "::error::v${{ steps.version.outputs.version }} is already tagged. Bump the version for a new release."
            exit 1
          fi

  ci:
    name: CI must pass
    needs: [prepare]
    uses: ./.github/workflows/ci.yml

  sdk:
    name: The clients must pass
    needs: [prepare]
    uses: ./.github/workflows/sdk.yml

  release-build:
    name: Build and check
    needs: [prepare, ci, sdk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS files
        run: git lfs pull

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build release distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: The built version is the one being released
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          wanted = os.environ["VERSION"]
          wheel = next(pathlib.Path("dist").glob("*.whl")).name
          built = re.match(r"vectrixdb-([^-]+)-", wheel).group(1)
          if wanted != built:
              sys.exit(f"releasing {wanted!r} but built {built!r}")
          print(f"version agrees: {built}")
          PY

      - name: PyPI will accept it
        run: |
          python -m twine check --strict dist/*
          python - <<'PY'
          import pathlib, sys
          limit = 100 * 1024 * 1024
          for f in pathlib.Path("dist").iterdir():
              size = f.stat().st_size
              print(f"{f.name}: {size / 1024 / 1024:.1f} MiB")
              if size > limit:
                  sys.exit(f"{f.name} is over PyPI's 100 MB limit")
          PY

      # The optional models are fetched from Hugging Face first and from
      # these releases when it is blocked. A missing one is reported here and
      # on the run's summary, and does not stop the release.
      - name: The optional model releases are there
        continue-on-error: true
        run: |
          {
            echo "### Optional model releases"
            echo '```'
            python scripts/check_model_releases.py || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python scripts/check_model_releases.py

      - name: Release notes from the changelog
        run: python scripts/release_notes.py "${{ needs.prepare.outputs.version }}" > dist-notes.md

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: |
            dist/
            dist-notes.md
            docs/reference/openapi.json

  github-release:
    name: Tag and GitHub release
    needs: [prepare, release-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: out/

      # Run from Actions: make the tag at the commit that was tested, and the
      # release with the changelog as its notes. Published by hand: attach the
      # files to the release that is already there. A gateway team imports
      # the OpenAPI document, so every release carries the route table it was
      # built from.
      - name: Make or fill the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag="v$VERSION"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh release create "$tag" out/dist/* out/docs/reference/openapi.json \
              --target "$GITHUB_SHA" \
              --title "VectrixDB $VERSION" \
              --notes-file out/dist-notes.md
          else
            gh release upload "$tag" out/dist/* out/docs/reference/openapi.json --clobber
          fi

  pypi-publish:
    name: Publish to PyPI
    needs: [github-release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing; replaces the API token
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: out/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: out/dist/

  # A failure here leaves the release on PyPI as it is: Actions > Containers >
  # Run workflow, with the version, builds the images again.
  containers:
    name: Container images
    needs: [prepare, pypi-publish]
    uses: ./.github/workflows/containers.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      wheels-artifact: release-dists
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write # the weekly scan's, asked for though a release skips it

  # The clients, at the same version, once PyPI has the package. Each step
  # asks its registry first and skips a version that is already there.
  npm-publish:
    name: Publish the TypeScript client to npm
    needs: [prepare, pypi-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing, and the provenance npm shows
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11

      - name: Publish, unless npm has it already
        env:
          VERSION: ${{ needs.prepare.outputs.client_version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "vectrixdb@$VERSION" version > /dev/null 2>&1; then
            echo "npm already has vectrixdb $VERSION"; exit 0
          fi
          cp ../../LICENSE ../../NOTICE .
          npm ci
          npm run build
          # A pre-release goes out under "next", so `npm install vectrixdb`
          # keeps giving the last release.
          case "$VERSION" in
            *-*) npm publish --access public --provenance --tag next ;;
            *) npm publish --access public --provenance ;;
          esac

  crates-publish:
    name: Publish the Rust client to crates.io
    needs: [prepare, pypi-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing
    env:
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - uses: actions/checkout@v4

      - name: Does crates.io have it already
        id: there
        env:
          VERSION: ${{ needs.prepare.outputs.client_version }}
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' -A 'VectrixDB release' \
            "https://crates.io/api/v1/crates/vectrixdb/$VERSION")"
          if [ "$code" = "200" ]; then
            echo "crates.io already has vectrixdb $VERSION"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign in to crates.io as this workflow
        id: auth
        if: steps.there.outputs.skip != 'true' && env.HAS_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        if: steps.there.outputs.skip != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cp ../../LICENSE ../../NOTICE .
          cargo publish --locked --allow-dirty

  go-tag:
    name: Tag the Go client
    needs: [prepare, pypi-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Go finds a module in a subfolder by a tag of that folder's path and
      # the version, at the commit that was released.
      - name: Tag sdk/go/v${{ needs.prepare.outputs.client_version }}
        env:
          VERSION: ${{ needs.prepare.outputs.client_version }}
        run: |
          tag="sdk/go/v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "$tag exists already"; exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"

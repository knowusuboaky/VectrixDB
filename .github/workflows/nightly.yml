name: Nightly

# What a pull-request run cannot afford: the whole suite three times over to
# surface flakes, the slow tests, and (weekly) mutation testing of the small
# pure modules. Nothing here blocks a merge; it opens issues for people.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  flakes:
    name: Full suite, three runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run three times, slow tests included
        run: |
          set -e
          for run in 1 2 3; do
            echo "::group::run $run"
            python -m pytest tests -q -p no:cacheprovider
            echo "::endgroup::"
          done

  perf:
    name: Performance bounds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - run: python -m pytest tests -q -m perf -p no:cacheprovider
      - run: python scripts/import_time.py --check 300

  mutation:
    name: Mutation testing (weekly)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # The schedule is nightly and this job is weekly: it goes on by hand, or
      # on Sunday's run. Comparing the cron string held on every night.
      - id: day
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ "$(date -u +%u)" = 7 ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.day.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          lfs: true
      - if: steps.day.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # mutmut 3 reads a different [tool.mutmut] (lists, not strings) and
      # stops on this one, which continue-on-error then hid.
      - if: steps.day.outputs.go == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "mutmut<3"
      # The small pure modules only: their tests run in seconds, so a mutant
      # costs seconds. Configuration is in pyproject [tool.mutmut].
      - if: steps.day.outputs.go == 'true'
        run: mutmut run
      - if: steps.day.outputs.go == 'true'
        run: mutmut results

  opensearch-live:
    name: OpenSearch contract, live
    # The same contract suite the fake runs on every push, against a real
    # domain. Skipped entirely when the repository has no endpoint secret,
    # so forks and local clones are not asked for AWS. The guard sits on the
    # steps rather than the job: jobs.<id>.if cannot read the secrets
    # context, so the condition that used to live there was never true and
    # this job never ran, secret or no secret.
    runs-on: ubuntu-latest
    env:
      HAVE_ENDPOINT: ${{ secrets.VECTRIXDB_OPENSEARCH_ENDPOINT != '' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Say why this is skipped
        if: env.HAVE_ENDPOINT != 'true'
        run: echo "No VECTRIXDB_OPENSEARCH_ENDPOINT secret; the live suite is skipped."
      - uses: actions/checkout@v4
        if: env.HAVE_ENDPOINT == 'true'
        with:
          lfs: true
      - uses: actions/setup-python@v5
        if: env.HAVE_ENDPOINT == 'true'
        with:
          python-version: "3.12"
      - if: env.HAVE_ENDPOINT == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" opensearch-py requests-aws4auth boto3
      - uses: aws-actions/configure-aws-credentials@v4
        if: env.HAVE_ENDPOINT == 'true'
        with:
          role-to-assume: ${{ secrets.VECTRIXDB_OPENSEARCH_ROLE_ARN }}
          aws-region: ${{ secrets.VECTRIXDB_OPENSEARCH_REGION || 'us-east-1' }}
      - name: Contract suite against the domain
        if: env.HAVE_ENDPOINT == 'true'
        env:
          VECTRIXDB_LIVE_BACKENDS: opensearch
          VECTRIXDB_OPENSEARCH_ENDPOINT: ${{ secrets.VECTRIXDB_OPENSEARCH_ENDPOINT }}
          VECTRIXDB_OPENSEARCH_REGION: ${{ secrets.VECTRIXDB_OPENSEARCH_REGION || 'us-east-1' }}
          VECTRIXDB_OPENSEARCH_SERVICE: ${{ secrets.VECTRIXDB_OPENSEARCH_SERVICE || 'aoss' }}
          VECTRIXDB_OPENSEARCH_PREFIX: ci${{ github.run_id }}
        run: python -m pytest tests/unit/test_storage_contract.py -q -p no:cacheprovider -k opensearch -m backend

  object-lock-live:
    name: Object lock, live
    # The fake store enforces the lock on every push. Whether S3 does is a
    # claim only S3 can make, so this runs the gated test against a bucket
    # created with Object Lock enabled, when the repository has one. The
    # objects it writes stay for a day, which is the point. Skipped without
    # the secret, so forks are not asked for AWS.
    runs-on: ubuntu-latest
    env:
      HAVE_BUCKET: ${{ secrets.VECTRIXDB_OBJECT_LOCK_BUCKET != '' }}
    steps:
      - name: Say why this is skipped
        if: env.HAVE_BUCKET != 'true'
        run: echo "No VECTRIXDB_OBJECT_LOCK_BUCKET secret; the live object-lock test is skipped."
      - uses: actions/checkout@v4
        if: env.HAVE_BUCKET == 'true'
        with:
          lfs: true
      - uses: actions/setup-python@v5
        if: env.HAVE_BUCKET == 'true'
        with:
          python-version: "3.12"
      - if: env.HAVE_BUCKET == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" boto3
      - uses: aws-actions/configure-aws-credentials@v4
        if: env.HAVE_BUCKET == 'true'
        with:
          role-to-assume: ${{ secrets.VECTRIXDB_OBJECT_LOCK_ROLE_ARN }}
          aws-region: ${{ secrets.VECTRIXDB_OBJECT_LOCK_REGION || 'us-east-1' }}
      - name: S3 refuses to alter what was written
        if: env.HAVE_BUCKET == 'true'
        env:
          VECTRIXDB_LIVE_BACKENDS: s3_object_lock
          VECTRIXDB_OBJECT_LOCK_BUCKET: ${{ secrets.VECTRIXDB_OBJECT_LOCK_BUCKET }}
        run: python -m pytest tests/unit/test_objectlock_live.py -q -p no:cacheprovider -m backend

  rls:
    name: Row level security, against a real PostgreSQL
    # The one entitlement claim the suite cannot make for itself. Everything
    # else about SET LOCAL ROLE is checked against an in-memory stand-in on
    # every push; whether PostgreSQL then refuses the rows is a question only
    # PostgreSQL answers, and it is the answer the feature exists for.
    #
    # A service container rather than a cloud database on purpose: no
    # secrets, no account, nothing to leave running, and the postgres image
    # enforces row level security exactly as Aurora does. It is the pgvector
    # build of postgres 16, not postgres:16 itself: the Aurora backend runs
    # CREATE EXTENSION vector when it connects, and the plain image has no
    # such extension, so every test stopped in the fixture.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: vectrix
          POSTGRES_DB: vectrix
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" psycopg2-binary
      - name: Row level security holds
        env:
          VECTRIXDB_LIVE_BACKENDS: postgres_rls
          VECTRIXDB_RLS_DSN: postgresql://postgres:vectrix@localhost:5432/vectrix
        run: python -m pytest tests/unit/test_rls_live.py -q -p no:cacheprovider -m backend

  shards:
    name: Sealed shards still pay for themselves
    # The fan-out cost is a measured claim on the docs site, so it is
    # measured again nightly at a size that runs in a couple of minutes. It
    # reports rather than gates: latency on a shared runner is noisy, and a
    # red build over runner noise is a build people learn to ignore.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Fan-out cost against shard count
        run: python scripts/shard_bench.py --vectors 20000 --dims 128 --queries 200 --shards 1 10 50
      - name: The same with a fifth of the documents deleted
        run: python scripts/shard_bench.py --vectors 20000 --dims 128 --queries 100 --shards 1 10 --deleted 0.2

  model-releases:
    name: Model release assets exist
    # vectrixdb download-models fetches each model from a GitHub release
    # before falling back to HuggingFace. The tags are named in the code and
    # none has been released yet, so the fallback has never worked. This
    # reports which assets answer, and does not gate anything: publishing
    # them is a maintainer's act (scripts/publish_models.py says how).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - run: python scripts/check_model_releases.py

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package with every runtime extra
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -e ".[all]" || python -m pip install -e .
      - name: pip-audit
        # Fails on a known vulnerability in anything installed. Nightly rather
        # than per push so an upstream CVE cannot block unrelated work, and
        # loud enough that it is seen the next morning.
        #
        # One advisory is set aside, by its id, so a new one still fails.
        # PYSEC-2026-4114 is a timing comparison in oauthlib's authorization
        # server, where it checks a PKCE verifier; the fix is oauthlib 4.0.
        # oauthlib is here only through databricks-sql-connector (the
        # databricks extra), which pins it below 4.0 as of 4.6.0 and uses
        # only its client, to sign in to a workspace. Nothing in VectrixDB
        # imports oauthlib, and no installed code runs its server, so the
        # comparison is never made. Remove this once the connector allows 4.0.
        run: python -m pip_audit --progress-spinner off --desc on --ignore-vuln PYSEC-2026-4114

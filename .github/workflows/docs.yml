# Build the docs site with MkDocs and publish it to GitHub Pages.
#
# One-time setup in the repository settings: Pages, Source: "GitHub Actions".
# After that every push to main that touches the docs, mkdocs.yml or the
# package (mkdocstrings reads docstrings) rebuilds the site at
# https://knowusuboaky.github.io/VectrixDB/. Pull requests build but do not
# deploy, so a broken page fails the check before it can go live.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "vectrixdb/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package and the docs extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      - name: Build
        run: mkdocs build --strict --site-dir site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
